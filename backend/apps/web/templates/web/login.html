{% extends "web/base.html" %}

{% block title %}Masuk — SatuSurvey{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto bg-card border border-slate-200 rounded-xl p-6">
  <h1 class="text-xl font-bold mb-4">Masuk</h1>
  {% if form.errors %}
  <p class="bg-warn-bg text-warn text-sm rounded-lg px-3 py-2 mb-4">
    Nama pengguna atau kata sandi salah.
  </p>
  {% endif %}
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="id_username" class="block text-sm font-medium mb-1">Nama pengguna</label>
      <input type="text" name="username" id="id_username" required
             class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label for="id_password" class="block text-sm font-medium mb-1">Kata sandi</label>
      <input type="password" name="password" id="id_password" required
             class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit"
            class="w-full bg-accent text-white py-2 rounded-lg font-semibold hover:opacity-90">
      Masuk
    </button>
  </form>
</div>
{% endblock %}
